name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        
    - name: Build Next.js for static export
      run: npm run build
      
    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        
    - name: Initialize Capacitor (if needed)
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug
      
    - name: Rename and move APK
      run: |
        mkdir -p output
        cp android/app/build/outputs/apk/debug/app-debug.apk output/ai-agent-ide-debug.apk
        ls -lh output/
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-agent-ide-debug-apk
        path: output/ai-agent-ide-debug.apk
        retention-days: 30
