name: Build Unsigned APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: |
        npm install
        npm install -g @capacitor/cli
        
    - name: Build Next.js production
      run: npm run build
      
    - name: Add Capacitor Android
      run: |
        npx cap add android || echo "Android already added"
        
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Build debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename and move APK
      run: |
        mkdir -p output
        cp android/app/build/outputs/apk/debug/app-debug.apk output/ai-agent-ide-debug.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-agent-ide-debug-apk
        path: output/ai-agent-ide-debug.apk
        retention-days: 30
